[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "aicr-research"
version = "0.1.0"
description = "Reproducible, blinded review-comment investigation with Pi"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "jsonschema>=4.23,<5"]

[project.scripts]
aicr = "aicr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
